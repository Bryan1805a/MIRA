name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (for example 1.1.0)'
        required: false
      versionCode:
        description: 'Version code (integer, defaults to the run number)'
        required: false
      apiBaseUrl:
        description: 'Public backend base URL'
        required: true
        default: 'https://api.example.com/'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.versionName }}" ]; then
            name="${{ inputs.versionName }}"
          else
            name="${GITHUB_REF_NAME#v}"
          fi

          if [ -n "${{ inputs.versionCode }}" ]; then
            code="${{ inputs.versionCode }}"
          else
            code="${GITHUB_RUN_NUMBER}"
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Require release secrets
        shell: bash
        env:
          MIRA_KEYSTORE_BASE64: ${{ secrets.MIRA_KEYSTORE_BASE64 }}
          MIRA_KEYSTORE_PASSWORD: ${{ secrets.MIRA_KEYSTORE_PASSWORD }}
          MIRA_KEY_ALIAS: ${{ secrets.MIRA_KEY_ALIAS }}
          MIRA_KEY_PASSWORD: ${{ secrets.MIRA_KEY_PASSWORD }}
        run: |
          for name in \
            MIRA_KEYSTORE_BASE64 \
            MIRA_KEYSTORE_PASSWORD \
            MIRA_KEY_ALIAS \
            MIRA_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - name: Decode release keystore
        shell: bash
        env:
          MIRA_KEYSTORE_BASE64: ${{ secrets.MIRA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MIRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira-release.jks"

      - name: Build signed release
        env:
          MIRA_KEYSTORE_FILE: ${{ runner.temp }}/mira-release.jks
          MIRA_KEYSTORE_PASSWORD: ${{ secrets.MIRA_KEYSTORE_PASSWORD }}
          MIRA_KEY_ALIAS: ${{ secrets.MIRA_KEY_ALIAS }}
          MIRA_KEY_PASSWORD: ${{ secrets.MIRA_KEY_PASSWORD }}
          MIRA_API_BASE_URL: ${{ inputs.apiBaseUrl || vars.MIRA_API_BASE_URL || 'https://api.example.com/' }}
          MIRA_VERSION_CODE: ${{ steps.version.outputs.code }}
          MIRA_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: mira-release-apk-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: mira-release-aab-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
