# MIRA production profile.
# Secrets are injected as environment variables by the hosting platform.

server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/event-stream

spring.lifecycle.timeout-per-shutdown-phase=30s
spring.flyway.clean-disabled=true

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

management.endpoint.health.show-details=never

logging.level.root=INFO
logging.structured.format.console=ecs

# The documented deployment sits behind a trusted PaaS reverse proxy.
# Set MIRA_TRUST_FORWARDED_HEADERS=false if the backend is directly exposed.
mira.auth.rate-limit.trust-forwarded-headers=${MIRA_TRUST_FORWARDED_HEADERS:true}
