spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.application.name=mira-backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

mira.jwt.secret-base64=${MIRA_JWT_SECRET_BASE64}
mira.jwt.issuer=https://mira-backend

mira.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
mira.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
mira.ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

mira.memory.extraction.scheduler-enabled=true
mira.memory.extraction.poll-interval-ms=2000
mira.memory.extraction.max-attempts=3
mira.memory.extraction.stale-after-seconds=300
mira.memory.extraction.recovery-interval-ms=60000

mira.auth.rate-limit.login-email-limit=5
mira.auth.rate-limit.login-ip-limit=30
mira.auth.rate-limit.register-ip-limit=5
mira.auth.rate-limit.refresh-ip-limit=60
mira.auth.rate-limit.window-seconds=60
mira.auth.rate-limit.trust-forwarded-headers=false
mira.auth.rate-limit.cleanup-interval-ms=600000
